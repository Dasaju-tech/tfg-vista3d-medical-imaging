[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vista3d-tfg"
version = "0.1.0"
description = "Reproducible 3D medical image segmentation and quantitative reporting research prototype."
#requires-python = ">=3.11,<3.12"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "scipy",
    "nibabel",
    "SimpleITK",
    "pandas",
    "matplotlib",
    "scikit-image",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 88
target-version = "py311"